baseURL = 'https://waeren.net/'
locale = 'en-us'
title = "waeren.net"
#title = 'Tim Pinoy - Blog & notes'

# This defines how dates are formatted
defaultContentLanguage = "en-us"
defaultContentLanguageInSubdir = false

# Enable emojis globally
enableEmoji = true

# set markup.highlight.noClasses=false to enable code highlight
[markup]
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = 'hrdark'
    tabWidth = 4
  [markup.goldmark.renderer]
    unsafe = true
    [markup.tableOfContents]
      startLevel = 2 # ToC starts from H2
      endLevel = 4 # ToC ends at H4
      ordered = true # generates <ul> instead of <ol>


[module]
  [[module.imports]]
    path = "github.com/hugo-sid/hugo-blog-awesome/v2"

############################## English language ################################
[Languages.en-us]
  locale = "English"
  label = "en-us"
  contentDir = "content/en"
  weight = 1

  [Languages.en-us.menu]
  [[Languages.en-us.menu.main]]
    # The page reference (pageRef) is useful for menu highlighting
    # When pageRef is set, setting `url` is optional; it will be used as a fallback if the page is not found.
    pageRef="/"
    name = 'Home'
    url = '/'
    weight = 10
  [[Languages.en-us.menu.main]]
    pageRef="posts"
    name = 'Posts'
    url = '/posts/'
    weight = 20
  [[Languages.en-us.menu.main]]
    pageRef="about"
    name = 'About'
    url = '/about/'
    weight = 30

[Languages.en-us.params]
  sitename = "Tim Pinoy"
  defaultColor = "auto" # set default color mode: dark or light or auto
  description = "A blog with my thoughs, notes, and projects"
  mainSections = ['posts']
  toc = true # set to false to disable table of contents globally
  goToTop = true # set to false to disable 'go to top' button
  dateFormat = "" # date format used to show dates on various pages. If nothing is specified, then "2 Jan 2006" format is used.
  rssFeedDescription = "summary" # available options: 1) summary 2) full
  # summary - includes a short summary of the blog post in the RSS feed. Generated using Hugo .Summary .
  # full - includes full blog post in the RSS feed. Generated using Hugo .Content .
  # By default (or if nothing is specified), summary is used.

[Languages.en-us.params.author]
  #avatar = "someone.jpg"
  intro = "Tim Pinoy"
  name = "Tim"
  description = "A blog with my thoughts, notes, and projects."

 [[Languages.en-us.params.socialIcons]]
 name = "github"
 url = "https://github.com/timpinoy"

